<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0d0e"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="55%">
      <stop offset="0" stop-color="#e5484d" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#e5484d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- grid -->
  <g stroke="#1c1c1f" stroke-width="1">
    <path d="M0 158 H1200 M0 316 H1200 M0 474 H1200 M300 0 V630 M600 0 V630 M900 0 V630"/>
  </g>
  <!-- syscall flow diagram (top right) -->
  <g fill="none" stroke="#2a2a2e" stroke-width="2">
    <!-- Ring 3 box -->
    <rect x="920" y="55" width="200" height="35" rx="3"/>
    <!-- Arrow down -->
    <line x1="1020" y1="90" x2="1020" y2="110"/>
    <!-- Kernel transition -->
    <rect x="920" y="110" width="200" height="35" rx="3"/>
    <!-- Arrow down -->
    <line x1="1020" y1="145" x2="1020" y2="165"/>
    <!-- Kernel box -->
    <rect x="920" y="165" width="200" height="35" rx="3"/>
  </g>
  <text x="932" y="77" font-family="'JetBrains Mono', monospace" font-size="13" fill="#3a3a3e">User Mode</text>
  <text x="932" y="132" font-family="'JetBrains Mono', monospace" font-size="13" fill="#3a3a3e">syscall</text>
  <text x="932" y="187" font-family="'JetBrains Mono', monospace" font-size="13" fill="#3a3a3e">Kernel Mode</text>
  <!-- main heading -->
  <text x="80" y="310" font-family="'JetBrains Mono', monospace" font-size="54" font-weight="700" fill="#fafafa">Direct</text>
  <text x="80" y="376" font-family="'JetBrains Mono', monospace" font-size="54" font-weight="700" fill="#e5484d">Syscalls</text>
  <text x="80" y="434" font-family="'JetBrains Mono', monospace" font-size="30" font-weight="700" fill="#fafafa">Evasion</text>
  <!-- subline -->
  <text x="80" y="494" font-family="'JetBrains Mono', monospace" font-size="24" fill="#8a8a93">windows internals · malware development</text>
</svg>
